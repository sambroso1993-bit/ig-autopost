name: IG Reels autopost

on:
  schedule:
    # UTC-время. Слоты МСК = UTC+3. Покрываем 10:05/13:05/16:05/19:05/22:05 МСК.
    - cron: "5 7,10,13,16,19 * * *"
  workflow_dispatch: {}       # кнопка "Run workflow" вручную (для догона бэклога сразу)

permissions:
  contents: write             # чтобы коммитить обратно метки done в due.json

concurrency:
  group: ig-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Publish due reels
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publish.py
      - name: Commit done flags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add due.json
          git commit -m "autopost: mark published" || echo "nothing to commit"
          git push || echo "nothing to push"
